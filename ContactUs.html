<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Cafe Tamia</title>
  <link rel="icon" type="image/png" href="logo.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=League+Spartan:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Paste all CSS here */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --gold: #c9a84c;
      --gold-dim: #9c7a2e;
      --gold-pale: rgba(201, 168, 76, 0.12);
      --gold-border: rgba(201, 168, 76, 0.3);
      --white: #f5f0e8;
      --off-white: rgba(245, 240, 232, 0.85);
      --muted: rgba(245, 240, 232, 0.45);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.07);
      --divider: rgba(201, 168, 76, 0.2);
    }

    body {
      font-family: 'League Spartan', sans-serif;
      background-color: #080808;
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .contact-section {
      max-width: 600px;
      margin: 80px auto;
      padding: 0 20px;
      text-align: center;
      flex: 1;
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--gold);
      margin-bottom: 20px;
    }

    .contact-section address {
      font-style: normal;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .social-links {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
    }

    .social-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--white);
      font-size: 1.8rem;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .social-icon:hover {
      border-color: var(--gold);
      background: var(--gold-pale);
      color: var(--gold);
      transform: translateY(-3px);
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--off-white);
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: 0.05em;
      padding: 10px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    .contact-link:hover {
      border-color: var(--gold-border);
      background: var(--gold-pale);
      color: var(--gold);
    }

    .contact-link i {
      color: var(--gold);
      font-size: 1.1rem;
    }

    footer {
      border-top: 1px solid var(--divider);
      padding: 28px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    footer .foot-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: var(--gold);
      letter-spacing: 0.15em;
    }

    footer a {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--gold);
    }

    @media (max-width: 700px) {
      .contact-section { margin: 50px auto; }
      .section-title { font-size: 2rem; }
      .social-icon { width: 50px; height: 50px; font-size: 1.5rem; }
      footer { flex-direction: column; gap: 12px; text-align: center; padding: 20px; }
    }
  </style>
</head>
<body>

  <section id="contact" class="contact-section">
    <h2 class="section-title">Contact Us</h2>
    <br>
    <address>
      

      <div class="social-links">
        <a href="https://www.facebook.com/profile.php?id=61579058227638" target="_blank" class="social-icon">
          <i class="fa-brands fa-facebook"></i> 
        </a>
        <a href="https://www.instagram.com/cafe_tamia?utm_source=ig_web_button_share_sheet&igsh=cjVxbTBzbjdnOGVz" target="_blank" class="social-icon">
          <i class="fa-brands fa-instagram"></i> 
        </a>
      </div>


      <p>
        <a href="tel:+639657517380" class="contact-link">
          <i class="fa-solid fa-phone"></i> +639657517380
        </a>
      </p>

      <p>
        <a href="mailto:cafetamia30@gmail.com" class="contact-link">
          <i class="fa-solid fa-envelope"></i> cafetamia30@gmail.com
        </a>
      </p>

    </address>
  </section>

 <footer>
  <span class="foot-logo"></span>
  <div style="display:flex;gap:16px;align-items:center;">
    <a href="home.html">← Back to Home</a>
    <span style="color:var(--muted);font-size:0.65rem;letter-spacing:0.1em;">
      Developed by <span style="color:var(--gold);">Kuys Yans</span>
    </span>
  </div>
</footer>
  <!-- Your HTML content here -->
</body>
</html>
