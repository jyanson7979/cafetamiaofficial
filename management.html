  <script>
    // GUARD: run this BEFORE anything else loads
    (function() {
        const isLoggedIn = sessionStorage.getItem('isAdminLoggedIn');
        const loginTime = sessionStorage.getItem('loginTime');
        const SESSION_TIMEOUT = 30 * 60 * 1000; // 30 minutes, adjust as needed

        const expired = !loginTime || (Date.now() - parseInt(loginTime) > SESSION_TIMEOUT);

        if (isLoggedIn !== 'true' || expired) {
            sessionStorage.removeItem('isAdminLoggedIn');
            sessionStorage.removeItem('loginTime');
            window.location.replace('home.html'); // send them back, no access
        }
    })();
</script>

</head>

<script>

  // CONFIGURATION

  const JSONBIN_URL = 'https://api.jsonbin.io/v3/b';
  const JSONBIN_KEY = '$2a$10$abEC7uvw/Cged3j1FxhyY.txG5oddE65MY4TUfNfBurIM0AuJiRUm';
  const BIN_ID = '6a37e2f8da38895dfee6d1d4';

  const CLOUD_NAME = "ddrxeqaxh";
  const UPLOAD_PRESET = "cafetamia_upload";

  // ═══════════════════════════════════════════════════════════
  // DATA
  // ═══════════════════════════════════════════════════════════
  let menuData = {
    nonCoffeeHot: [],
    nonCoffeeIced: [],
    coffeeHot: [],
    coffeeIced: [],
    food: []

  let editCategory = null;
  let isSaving = false;

  // ═══════════════════════════════════════════════════════════
  // CLOUDINARY UPLOAD - Using Fetch API
  // ═══════════════════════════════════════════════════════════
  async function uploadImage(input) {
    const file = input.files[0];
    if (!file) return;

    showToast('📤 Uploading image...', '');

    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', UPLOAD_PRESET);
    formData.append('folder', 'cafe-tamia-menu');

    try {
      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
        method: 'POST',
        body: formData
      });

      const data = await response.json();

      if (data.secure_url) {
        document.getElementById('newProductImageUrl').value = data.secure_url;
        
        // Show preview
        const preview = document.getElementById('imagePreview');
        const img = document.getElementById('previewImg');
        img.src = data.secure_url;
        preview.style.display = 'block';
        
        // Update label
        document.getElementById('uploadLabel').textContent = '✅ Image uploaded! Click to change';
        
        showToast('✓ Image uploaded successfully!', 'success');
      } else {
        throw new Error('Upload failed');
      }
    } catch (error) {
      console.error('Upload error:', error);
      showToast('⚠ Upload failed: ' + error.message, 'error');
      // Reset file input
      input.value = '';
    }
  }

  // ═══════════════════════════════════════════════════════════
  // LOAD DATA FROM JSONBIN
  // ═══════════════════════════════════════════════════════════
  async function loadAllData() {
    try {
      showToast('Loading data...', '');
      
      const response = await fetch(`${JSONBIN_URL}/${BIN_ID}`, {
        headers: { 
          'X-Master-Key': JSONBIN_KEY,
          'Content-Type': 'application/json'
        }
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.message || 'Failed to load data');
      }

      const data = await response.json();
      
      if (data.record) {
        menuData = data.record;
        renderAll();
        showToast('✓ Data loaded from JSONBin!', 'success');
        document.getElementById('lastSaved').textContent = `Last saved: ${new Date().toLocaleTimeString()}`;
      } else {
        throw new Error('No data found in bin');
      }
    } catch (error) {
      console.error('Error loading data:', error);
      showToast('⚠ Error loading data: ' + error.message, 'error');
      loadDefaultData();
    }
  }

    };

  }

  // ═══════════════════════════════════════════════════════════
  // SAVE TO JSONBIN
  // ═══════════════════════════════════════════════════════════
  async function saveAllChanges() {
    if (isSaving) return;
    isSaving = true;

    try {
      showToast('Saving...', '');
      
      const response = await fetch(`${JSONBIN_URL}/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': JSONBIN_KEY
        },
        body: JSON.stringify(menuData)
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.message || 'Failed to save');
      }

      document.getElementById('lastSaved').textContent = `Last saved: ${new Date().toLocaleTimeString()}`;
      showToast('✓ All changes saved to JSONBin!', 'success');
    } catch (error) {
      console.error('Error saving:', error);
      showToast('⚠ Error saving changes: ' + error.message, 'error');
    } finally {
      isSaving = false;
    }
  }

  // ═══════════════════════════════════════════════════════════
  // RENDER FUNCTIONS
  // ═══════════════════════════════════════════════════════════
  function renderAll() {
    updateStats();
    renderMenu();
  }

  function updateStats() {
    const total = menuData.nonCoffeeHot.length + menuData.nonCoffeeIced.length + 
                  menuData.coffeeHot.length + menuData.coffeeIced.length + 
                  menuData.food.length;
    const totalNonCoffee = menuData.nonCoffeeHot.length + menuData.nonCoffeeIced.length;
    const totalCoffee = menuData.coffeeHot.length + menuData.coffeeIced.length;
    
    document.getElementById('totalItems').textContent = total;
    document.getElementById('totalNonCoffee').textContent = totalNonCoffee;
    document.getElementById('totalCoffee').textContent = totalCoffee;
    document.getElementById('totalFood').textContent = menuData.food.length;
  }

  function renderMenu() {
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = '';

    const categoryMap = {
      'nonCoffeeHot': menuData.nonCoffeeHot,
      'nonCoffeeIced': menuData.nonCoffeeIced,
      'coffeeHot': menuData.coffeeHot,
      'coffeeIced': menuData.coffeeIced,
      'food': menuData.food
    };

    let items = [];
    const categoryLabels = {
      'nonCoffeeHot': '☕ Non-Coffee Hot',
      'nonCoffeeIced': '🧊 Non-Coffee Iced',
      'coffeeHot': '☕ Coffee Hot',
      'coffeeIced': '🧊 Coffee Iced',
      'food': '🍽️ Food'
    };

    if (currentFilter === 'all') {
      Object.keys(categoryMap).forEach(cat => {
        categoryMap[cat].forEach((item, i) => {
          items.push({ ...item, category: cat, index: i });
        });
      });
    } else {
      categoryMap[currentFilter].forEach((item, i) => {
        items.push({ ...item, category: currentFilter, index: i });
      });
    }

    if (items.length === 0) {
      grid.innerHTML = `<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px 0;">No items in this category. Add one below!</p>`;
      return;
    }

    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'menu-card-admin';
      
      const imgHtml = item.img ? 
        `<img src="${item.img}" alt="${item.name}" class="product-img" onerror="this.style.display='none'">` :
        `<div class="product-img-placeholder">No Image</div>`;

      card.innerHTML = `
        ${imgHtml}
        <div class="product-name">${item.name}</div>
        <div class="product-price">₱${item.price}</div>
        <div class="product-actions">
          <button class="btn btn-warning btn-sm" onclick="openEditModal('${item.category}', ${item.index})">✏️ Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteProduct('${item.category}', ${item.index})">🗑️ Delete</button>
        </div>
        <div class="category-badge">${categoryLabels[item.category] || item.category}</div>
      `;
      grid.appendChild(card);
    });
  }

  function filterCategory(category) {
    currentFilter = category;
    document.querySelectorAll('.category-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.category === category);
    });
    renderMenu();
  }

  // ═══════════════════════════════════════════════════════════
  // ADD PRODUCT
  // ═══════════════════════════════════════════════════════════
  function addProduct() {
    const name = document.getElementById('newProductName').value.trim();
    const price = parseFloat(document.getElementById('newProductPrice').value);
    const category = document.getElementById('newProductCategory').value;
    const img = document.getElementById('newProductImageUrl').value.trim();

    if (!name) {
      showToast('⚠ Please enter a product name', 'error');
      return;
    }
    if (!price || price <= 0) {
      showToast('⚠ Please enter a valid price', 'error');
      return;
    }

    const newItem = { name, price, img: img || '' };
    
    if (category === 'nonCoffeeHot') {
      menuData.nonCoffeeHot.push(newItem);
    } else if (category === 'nonCoffeeIced') {
      menuData.nonCoffeeIced.push(newItem);
    } else if (category === 'coffeeHot') {
      menuData.coffeeHot.push(newItem);
    } else if (category === 'coffeeIced') {
      menuData.coffeeIced.push(newItem);
    } else if (category === 'food') {
      menuData.food.push(newItem);
    }

    // Reset form
    document.getElementById('newProductName').value = '';
    document.getElementById('newProductPrice').value = '';
    document.getElementById('newProductImageUrl').value = '';
    document.getElementById('uploadLabel').textContent = '📸 Click to upload image';
    document.getElementById('imagePreview').style.display = 'none';
    document.getElementById('imageInput').value = '';

    renderAll();
    saveAllChanges();
    showToast(`✓ Added: ${name}`, 'success');
  }

  // ═══════════════════════════════════════════════════════════
  // DELETE PRODUCT
  // ═══════════════════════════════════════════════════════════
  function deleteProduct(category, index) {
    if (!confirm(`Delete this item?`)) return;

    const categoryMap = {
      'nonCoffeeHot': menuData.nonCoffeeHot,
      'nonCoffeeIced': menuData.nonCoffeeIced,
      'coffeeHot': menuData.coffeeHot,
      'coffeeIced': menuData.coffeeIced,
      'food': menuData.food
    };

    const deleted = categoryMap[category].splice(index, 1)[0];
    renderAll();
    saveAllChanges();
    showToast(`🗑️ Deleted: ${deleted.name}`, '');
  }

  // ═══════════════════════════════════════════════════════════
  // EDIT PRODUCT
  // ═══════════════════════════════════════════════════════════
  function openEditModal(category, index) {
    editCategory = category;
    editIndex = index;

    const categoryMap = {
      'nonCoffeeHot': menuData.nonCoffeeHot,
      'nonCoffeeIced': menuData.nonCoffeeIced,
      'coffeeHot': menuData.coffeeHot,
      'coffeeIced': menuData.coffeeIced,
      'food': menuData.food
    };

    const item = categoryMap[category][index];
    
    document.getElementById('editProductName').value = item.name;
    document.getElementById('editProductPrice').value = item.price;
    document.getElementById('editProductCategory').value = category;
    document.getElementById('editProductImage').value = item.img || '';

    document.getElementById('editModal').classList.add('active');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('active');
    editIndex = null;
    editCategory = null;
  }

  function saveEditProduct() {
    if (editIndex === null || editCategory === null) return;

    const categoryMap = {
      'nonCoffeeHot': menuData.nonCoffeeHot,
      'nonCoffeeIced': menuData.nonCoffeeIced,
      'coffeeHot': menuData.coffeeHot,
      'coffeeIced': menuData.coffeeIced,
      'food': menuData.food
    };

    const name = document.getElementById('editProductName').value.trim();
    const price = parseFloat(document.getElementById('editProductPrice').value);
    const category = document.getElementById('editProductCategory').value;
    const img = document.getElementById('editProductImage').value.trim();

    if (!name) {
      showToast('⚠ Please enter a product name', 'error');
      return;
    }
    if (!price || price <= 0) {
      showToast('⚠ Please enter a valid price', 'error');
      return;
    }

    // If category changed, move item
    if (category !== editCategory) {
      const oldItem = categoryMap[editCategory].splice(editIndex, 1)[0];
      oldItem.name = name;
      oldItem.price = price;
      oldItem.img = img || oldItem.img;
      
      if (category === 'nonCoffeeHot') {
        menuData.nonCoffeeHot.push(oldItem);
      } else if (category === 'nonCoffeeIced') {
        menuData.nonCoffeeIced.push(oldItem);
      } else if (category === 'coffeeHot') {
        menuData.coffeeHot.push(oldItem);
      } else if (category === 'coffeeIced') {
        menuData.coffeeIced.push(oldItem);
      } else if (category === 'food') {
        menuData.food.push(oldItem);
      }
    } else {
      const item = categoryMap[editCategory][editIndex];
      item.name = name;
      item.price = price;
      item.img = img || item.img;
    }

    closeEditModal();
    renderAll();
    saveAllChanges();
    showToast('✓ Product updated!', 'success');
  }

  // ═══════════════════════════════════════════════════════════
  // RESET ALL DATA
  // ═══════════════════════════════════════════════════════════
  function resetAllData() {
    loadDefaultData();
    showToast('🔄 Data reset to default', '');
  }

  // ═══════════════════════════════════════════════════════════
  // TOAST
  // ═══════════════════════════════════════════════════════════
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast';
    if (type) t.classList.add(type);
    t.classList.add('show');
    clearTimeout(t._timeout);
    t._timeout = setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ═══════════════════════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════════════════════
  loadAllData();

  // Auto-save every 30 seconds
  setInterval(() => {
    saveAllChanges();
  }, 30000);

  document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeEditModal();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeEditModal();
  });
</script>
