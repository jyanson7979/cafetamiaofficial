<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cafe Tamia — Swipe To Order</title>
    <link rel="icon" type="image/png" href="logo.jpg" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=League+Spartan:wght@300;400;500;600&family=Dancing+Script:wght@500&display=swap" rel="stylesheet" />
    <style>
        /* ── reset & base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --gold: #c9a84c;
            --gold-dim: #9c7a2e;
            --gold-pale: rgba(201, 168, 76, 0.15);
            --gold-border: rgba(201, 168, 76, 0.3);
            --white: #f5f0e8;
            --off-white: rgba(245, 240, 232, 0.85);
            --muted: rgba(245, 240, 232, 0.4);
            --dark-bg: #0a0a0a;
            --card-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            --danger: #ff4d4d;
            --success: #4caf50;
            --success-bg: rgba(76, 175, 80, 0.2);
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'League Spartan', sans-serif;
            background-color: var(--dark-bg);
            color: var(--white);
        }

        /* ── nav ── */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #3e2723;
            background: #f5f0e8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }
        .logo-cafe {
            font-family: 'Dancing Script', cursive;
            font-size: 11px;
            color: #3e2723;
            line-height: 1;
            margin-bottom: -2px;
        }
        .logo-tamia {
            font-family: 'League Spartan', sans-serif;
            font-weight: 700;
            font-size: 12px;
            color: #3e2723;
            line-height: 1;
        }
        .logo-beans {
            position: absolute;
            right: -12px;
            top: 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .bean {
            width: 12px;
            height: 16px;
            background: #5d4037;
            border-radius: 50%;
            position: relative;
            transform: rotate(15deg);
        }
        .bean::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 25%;
            width: 6px;
            height: 2px;
            background: #f5f0e8;
            border-radius: 4px;
            transform: translate(-50%, -50%);
        }
        .bean:nth-child(2) {
            transform: rotate(-15deg) translateY(-2px);
        }
        .bean:nth-child(3) {
            transform: rotate(25deg) translateY(-8px) translateX(6px);
            width: 10px;
            height: 14px;
        }
        .nav-title {
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            color: var(--gold);
        }
        .nav-cart {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
        }
        .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: #c9a84c;
            color: #111;
            font-size: 11px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── filters ── */
        .filters {
            position: fixed;
            top: 60px;
            left: 0;
            width: 100%;
            padding: 10px 16px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(8px);
            z-index: 90;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: transparent;
            color: var(--muted);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-btn.active {
            background: var(--gold);
            border-color: var(--gold);
            color: #000;
        }

        /* ── card stack ── */
        #app-container {
            position: fixed;
            top: 120px;
            left: 0;
            right: 0;
            bottom: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 16px;
        }
        .card-stack {
            position: relative;
            width: 100%;
            max-width: 360px;
            height: 100%;
            max-height: 550px;
            margin: 0 auto;
        }
        .swipe-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            background: #1a1a1a;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            cursor: grab;
            touch-action: none;
            user-select: none;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s cubic-bezier(0.1, 0.7, 0.1, 1), opacity 0.3s;
            transform: scale(0.95) translateY(20px);
            opacity: 0;
        }
        .swipe-card.visible {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        .swipe-card img {
            width: 100%;
            height: 65%;
            object-fit: cover;
            background: #111;
            pointer-events: none;
        }
        .card-info {
            padding: 20px 24px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-info h4 {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: var(--white);
        }
        .card-info .price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            color: var(--gold);
        }
        .swipe-indicator {
            position: absolute;
            top: 40px;
            padding: 8px 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 2.2rem;
            letter-spacing: 0.1em;
            border: 4px solid;
            opacity: 0;
            transform: rotate(-20deg);
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .indicator-nope {
            left: 20px;
            color: var(--danger);
            border-color: var(--danger);
        }
        .indicator-like {
            right: 20px;
            color: var(--success);
            border-color: var(--success);
        }
        .empty-state {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--muted);
        }
        .empty-state span {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .empty-state p {
            font-size: 0.85rem;
        }

        /* ── actions ── */
        .actions {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 0 20px;
            z-index: 80;
        }
        .action-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .action-btn:active {
            transform: scale(0.9);
        }
        .btn-nope {
            background: rgba(255, 77, 77, 0.2);
            color: var(--danger);
            border-color: var(--danger);
        }
        .btn-like {
            background: var(--success-bg);
            color: var(--success);
            border-color: var(--success);
        }
        .btn-super {
            background: rgba(0, 150, 255, 0.2);
            color: #00aaff;
            border-color: #00aaff;
            font-size: 1.2rem;
        }

        /* ── drawer ── */
        #drawerOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s ease;
        }
        #drawerOverlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .drawer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 85vh;
            background: #0f0f0f;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 24px 30px;
            transform: translateY(100%);
            transition: 0.3s cubic-bezier(0.2, 0.9, 0.1, 1);
            border-top: 1px solid var(--gold-border);
            overflow-y: auto;
        }
        #drawerOverlay.open .drawer {
            transform: translateY(0);
        }
        .drawer-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin: 0 auto 16px;
        }
        .drawer-title {
            font-size: 1.2rem;
            font-family: 'Cormorant Garamond', serif;
            color: var(--gold);
            letter-spacing: 0.06em;
            margin-bottom: 16px;
            text-align: center;
        }
        .drawer-list {
            list-style: none;
            margin-bottom: 16px;
        }
        .drawer-list li {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.8rem;
            color: var(--off-white);
            align-items: center;
        }
        .remove-item-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0 6px;
            transition: 0.2s;
        }
        .remove-item-btn:hover {
            transform: scale(1.2);
        }
        .drawer-total {
            display: flex;
            justify-content: space-between;
            padding: 12px 0 16px;
            border-top: 1px solid var(--gold-border);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
        }
        .drawer-total span:last-child {
            color: var(--gold);
        }

        .drawer-form input {
            width: 100%;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }
        .drawer-form input:focus {
            border-color: var(--gold-border);
        }
        .drawer-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: var(--gold);
            color: #080808;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .drawer-submit:disabled {
            background: #444;
            cursor: not-allowed;
            color: #888;
        }
        .drawer-submit.loading {
            opacity: 0.6;
            pointer-events: none;
        }
        .close-drawer-btn {
            margin-top: 10px;
            background: transparent;
            border: none;
            color: var(--muted);
            width: 100%;
            padding: 10px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        /* ── undo toast ── */
        #undoToast {
            position: fixed;
            top: 70px;
            right: 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 16px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 200;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.1, 1), opacity 0.3s;
            opacity: 0;
        }
        #undoToast.show {
            transform: translateX(0);
            opacity: 1;
        }
        #undoToast span {
            font-size: 0.8rem;
            color: var(--off-white);
        }
        #undoBtn {
            background: transparent;
            border: none;
            color: var(--success);
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        #undoBtn:hover {
            color: #5cbf60;
            text-decoration: underline;
        }

        /* ── error / status message ── */
        .payment-status {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            padding: 30px 40px;
            border-radius: 16px;
            border: 1px solid var(--gold-border);
            text-align: center;
            z-index: 500;
            max-width: 90%;
            display: none;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .payment-status.show {
            display: block;
        }
        .payment-status .icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        .payment-status h3 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--gold);
            font-size: 1.4rem;
            margin-bottom: 8px;
        }
        .payment-status p {
            color: var(--muted);
            font-size: 0.85rem;
        }
        .payment-status .close-status {
            margin-top: 16px;
            background: var(--gold);
            border: none;
            color: #000;
            padding: 8px 28px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .card-stack {
                max-height: 480px;
            }
            .actions {
                gap: 16px;
            }
            .action-btn {
                width: 56px;
                height: 56px;
                font-size: 1.4rem;
            }
            .drawer {
                padding: 20px 16px;
            }
            #undoToast {
                top: 64px;
                right: 10px;
                padding: 10px 14px;
            }
        }

        .nav-cart {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 28px;
    cursor: pointer;
    z-index: 9999;
}

.cart-count {
    position: absolute;
    top: -8px;
    right: -10px;
    background: red;
    color: white;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
}

    </style>
</head>
<body>

    <!-- ─── NAV ─── -->
<nav>
    <div class="nav-cart" onclick="toggleDrawer(true)">
        🛒
        <span class="cart-count" id="cartCount">0</span>
    </div>
</nav>

    <!-- ─── FILTERS ─── -->
    <div class="filters" id="filterContainer">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="coffee">☕ Coffee</button>
        <button class="filter-btn" data-filter="noncoffee">🧋 Non-Coffee</button>
        <button class="filter-btn" data-filter="food">🍽️ Food</button>
    </div>

    <!-- ─── UNDO TOAST ─── -->
    <div id="undoToast">
        <span>♥ Added!</span>
        <button id="undoBtn">Undo</button>
    </div>

    <!-- ─── CARD STACK ─── -->
    <div id="app-container">
        <div class="card-stack" id="cardStack">
            <div class="swipe-card" id="swipeCard">
                <img src="" id="cardImg" alt="Menu Item" onerror="this.style.display='none'" />
                <div class="card-info">
                    <h4 id="cardName">Loading...</h4>
                    <span class="price" id="cardPrice">₱0</span>
                </div>
                <div class="swipe-indicator indicator-nope">NOPE</div>
                <div class="swipe-indicator indicator-like">ADD</div>
            </div>
            <div class="empty-state" id="emptyState" style="display:none;">
                <span>✨</span>
                <p>No more items!<br />Change filter or restart.</p>
            </div>
        </div>
    </div>

    <!-- ─── ACTION BUTTONS ─── -->
    <div class="actions">
        <button class="action-btn btn-nope" onclick="triggerSwipe('left')">✕</button>
        <button class="action-btn btn-super" onclick="resetAllItems()">⟳</button>
        <button class="action-btn btn-like" onclick="triggerSwipe('right')">♥</button>
    </div>

    <!-- ─── PAYMENT STATUS OVERLAY ─── -->
    <div class="payment-status" id="paymentStatus">
        <div class="icon" id="statusIcon">⏳</div>
        <h3 id="statusTitle">Processing...</h3>
        <p id="statusMsg">Please wait while we connect to PayMongo.</p>
        <button class="close-status" onclick="closeStatus()">Close</button>
    </div>

    <!-- ─── DRAWER ─── -->
    <div id="drawerOverlay" onclick="toggleDrawer(false)">
        <div class="drawer" onclick="event.stopPropagation()">
            <div class="drawer-handle"></div>
            <div class="drawer-title">Your Order</div>
            <ul class="drawer-list" id="drawerOrderList"></ul>
            <div class="drawer-total"><span>Total</span><span id="drawerTotal">₱0</span></div>

            <form class="drawer-form" id="orderForm">
    <input type="text" id="customerName" placeholder="Your Name" required />
    <input type="text" id="customerAddress" placeholder="Your Address" required />
    <input type="text" id="contactNumber" placeholder="Your Contact" required />
    <button type="button" class="drawer-submit" id="submitBtn" onclick="handlePlaceOrder(event)">Pay with PayMongo</button>
</form>

    <script>
        // ═══════════════════════════════════════════════════════════
        //  CONFIGURATION
        // ═══════════════════════════════════════════════════════════

        const JSONBIN_URL = 'https://api.jsonbin.io/v3/b';
        const JSONBIN_KEY = '$2a$10$abEC7uvw/Cged3j1FxhyY.txG5oddE65MY4TUfNfBurIM0AuJiRUm';
        const BIN_ID = '6a37e2f8da38895dfee6d1d4';

        // ═══════════════════════════════════════════════════════════
        //  STATE
        // ═══════════════════════════════════════════════════════════

        let menuData = { nonCoffeeHot: [], nonCoffeeIced: [], coffeeHot: [], coffeeIced: [], food: [] };
        let allItems = [];
        let currentQueue = [];
        let orders = [];
        let total = 0;
        let currentFilter = 'all';
        let isAnimating = false;
        let lastAddedItem = null;

        // DOM refs
        const swipeCard = document.getElementById('swipeCard');
        const cardImg = document.getElementById('cardImg');
        const cardName = document.getElementById('cardName');
        const cardPrice = document.getElementById('cardPrice');
        const emptyState = document.getElementById('emptyState');
        const indicatorNope = swipeCard.querySelector('.indicator-nope');
        const indicatorLike = swipeCard.querySelector('.indicator-like');
        const cartCount = document.getElementById('cartCount');
        const undoToast = document.getElementById('undoToast');
        const undoBtn = document.getElementById('undoBtn');
        const submitBtn = document.getElementById('submitBtn');
        const paymentStatus = document.getElementById('paymentStatus');

        // ═══════════════════════════════════════════════════════════
        //  SWIPE LOGIC
        // ═══════════════════════════════════════════════════════════

        let startX = 0,
            startY = 0,
            isDragging = false;
        let currentX = 0;

        function attachSwipeEvents() {
            ['mousedown', 'touchstart'].forEach(evt => {
                swipeCard.addEventListener(evt, (e) => {
                    if (isAnimating || currentQueue.length === 0) return;
                    isDragging = true;
                    startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                    startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                    swipeCard.style.transition = 'none';
                    indicatorNope.style.opacity = '0';
                    indicatorLike.style.opacity = '0';
                    undoToast.classList.remove('show');
                });
            });

            ['mousemove', 'touchmove'].forEach(evt => {
                document.addEventListener(evt, (e) => {
                    if (!isDragging) return;
                    const x = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                    const diffX = x - startX;
                    currentX = diffX;
                    const rotate = diffX * 0.08;
                    swipeCard.style.transform = `translateX(${diffX}px) rotate(${rotate}deg)`;
                    if (diffX > 20) { indicatorLike.style.opacity = '1';
                        indicatorNope.style.opacity = '0'; } else if (diffX < -20) { indicatorNope.style.opacity =
                        '1';
                        indicatorLike.style.opacity = '0'; } else { indicatorNope.style.opacity = '0';
                        indicatorLike.style.opacity = '0'; }
                });
            });

            ['mouseup', 'touchend'].forEach(evt => {
                document.addEventListener(evt, (e) => {
                    if (!isDragging) return;
                    isDragging = false;
                    const endX = e.type.includes('mouse') ? e.clientX : e.changedTouches[0].clientX;
                    const diffX = endX - startX;
                    swipeCard.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.9, 0.1, 1), opacity 0.4s';
                    if (Math.abs(diffX) > 80) {
                        const direction = diffX > 0 ? 'right' : 'left';
                        finishSwipe(direction);
                    } else {
                        swipeCard.style.transform = 'translateX(0) rotate(0)';
                        indicatorNope.style.opacity = '0';
                        indicatorLike.style.opacity = '0';
                    }
                });
            });
        }

        function triggerSwipe(direction) {
            if (isAnimating || currentQueue.length === 0) return;
            swipeCard.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.9, 0.1, 1), opacity 0.4s';
            if (direction === 'right') {
                swipeCard.style.transform = 'translateX(300px) rotate(25deg)';
                indicatorLike.style.opacity = '1';
            } else {
                swipeCard.style.transform = 'translateX(-300px) rotate(-25deg)';
                indicatorNope.style.opacity = '1';
            }
            finishSwipe(direction);
        }

        function finishSwipe(direction) {
            isAnimating = true;
            const item = currentQueue[0];
            if (direction === 'right') {
                orders.push(item);
                total += item.price;
                lastAddedItem = item;
                updateSummary();
                showUndoToast();
            }
            setTimeout(() => {
                swipeCard.classList.remove('visible');
                currentQueue.shift();
                isAnimating = false;
                indicatorNope.style.opacity = '0';
                indicatorLike.style.opacity = '0';
                renderNextCard();
            }, 400);
        }

        // ─── undo toast ──────────────────────────────────────────

        let undoTimeout;

        function showUndoToast() {
            clearTimeout(undoTimeout);
            undoToast.classList.add('show');
            undoTimeout = setTimeout(() => {
                undoToast.classList.remove('show');
            }, 4000);
        }

        undoBtn.addEventListener('click', function() {
            if (lastAddedItem && orders.length > 0) {
                const popped = orders.pop();
                total -= popped.price;
                updateSummary();
                undoToast.classList.remove('show');
            }
        });

        // ─── render ──────────────────────────────────────────────

        function renderNextCard() {
            if (currentQueue.length === 0) {
                emptyState.style.display = 'flex';
                swipeCard.style.display = 'none';
                return;
            }
            emptyState.style.display = 'none';
            swipeCard.style.display = 'flex';
            const item = currentQueue[0];
            cardImg.src = item.img || '';
            cardImg.style.display = 'block';
            cardName.textContent = item.name;
            cardPrice.textContent = `₱${item.price}`;
            swipeCard.style.transform = 'scale(0.95) translateY(20px)';
            swipeCard.classList.remove('visible');
            setTimeout(() => {
                swipeCard.style.transition = 'transform 0.25s cubic-bezier(0.1, 0.7, 0.1, 1), opacity 0.25s';
                swipeCard.style.transform = 'scale(1) translateY(0)';
                swipeCard.classList.add('visible');
            }, 50);
        }

        function resetAllItems() {
            if (isAnimating) return;
            buildQueue(currentFilter);
            renderNextCard();
        }

        // ─── data & filters ──────────────────────────────────────

        function buildQueue(filter) {
            currentFilter = filter;
            if (filter === 'all') {
                currentQueue = [...allItems];
            } else {
                currentQueue = allItems.filter(item => item.category === filter);
            }
        }

                    menuData = data.record;
                    processMenuData();
                }
            } catch (error) {

        }

        function processMenuData() {
            allItems = [];
            const addItems = (arr, cat) => arr.forEach(i => allItems.push({ ...i, category: cat }));

            addItems(menuData.nonCoffeeIced, 'noncoffee');
            addItems(menuData.coffeeHot, 'coffee');
            addItems(menuData.coffeeIced, 'coffee');
            addItems(menuData.food, 'food');
            buildQueue('all');
            renderNextCard();
        }

        // ─── summary & drawer ────────────────────────────────────

        function updateSummary() {
            cartCount.textContent = `${orders.length}`;
            const list = document.getElementById('drawerOrderList');
            list.innerHTML = '';
            if (orders.length === 0) {
                list.innerHTML = '<li style="justify-content:center;color:var(--muted);padding:20px;">No items added yet.</li>';
            } else {
                const grouped = {};
                orders.forEach((o, index) => {
                    const key = `${o.name}|${o.price}`;
                    if (!grouped[key]) grouped[key] = { name: o.name, price: o.price, qty: 0, indices: [] };
                    grouped[key].qty++;
                    grouped[key].indices.push(index);
                });
                Object.values(grouped).forEach(g => {
                    const li = document.createElement('li');
                    const itemTotal = g.price * g.qty;
                    li.innerHTML = `
                <span>${g.qty > 1 ? `${g.name} ×${g.qty}` : g.name}</span>
                <div style="display:flex;align-items:center;gap:8px;">
                  <span>₱${itemTotal}</span>
                  <button class="remove-item-btn" onclick="removeOrderItem('${g.name.replace(/'/g, "\\'")}', ${g.price})">✕</button>
                </div>
              `;
                    list.appendChild(li);
                });
            }
            document.getElementById('drawerTotal').textContent = `₱${total}`;
        }

        function removeOrderItem(name, price) {
            for (let i = orders.length - 1; i >= 0; i--) {
                if (orders[i].name === name && orders[i].price === price) {
                    orders.splice(i, 1);
                    total -= price;
                    updateSummary();
                    return;
                }
            }
        }

        function toggleDrawer(open) {
            document.getElementById('drawerOverlay').classList.toggle('open', open);
            if (open) updateSummary();
        }

        // ─── status overlay ──────────────────────────────────────

        function showStatus(icon, title, msg) {
            document.getElementById('statusIcon').textContent = icon;
            document.getElementById('statusTitle').textContent = title;
            document.getElementById('statusMsg').textContent = msg;
            paymentStatus.classList.add('show');
        }

        function closeStatus() {
            paymentStatus.classList.remove('show');
        }

        // ═══════════════════════════════════════════════════════════
        //  PAYMONGO INTEGRATION  (serverless via /api)
        //  Two-step flow required by PayMongo's Payment Intents API:
        //    1) /api/create-payment  -> creates the Payment Intent, returns clientKey
        //    2) /api/attach-payment  -> creates + attaches a GCash Payment Method,
        //                               returns the redirectUrl to send the customer to
        // ═══════════════════════════════════════════════════════════

        async function handlePlaceOrder(e) {
            e.preventDefault();

            // 1. Validate
            if (orders.length === 0) {
                alert('Please add items to your order.');
                return false;
            }

            const name = document.getElementById('customerName').value.trim();
            const addr = document.getElementById('customerAddress').value.trim();
            const contact = document.getElementById('contactNumber').value.trim();

            if (!name || !addr || !contact) {
                alert('Please fill in all required fields.');
                return false;
            }

            console.log('Checking customerName:', document.getElementById('customerName'));
console.log('Checking customerAddress:', document.getElementById('customerAddress'));
console.log('Checking contactNumber:', document.getElementById('contactNumber'));


            // 2. Build order payload
            const orderPayload = {
    customerName: name,
    customerAddress: addr,
    contactNumber: contact,
    items: orders.map(o => ({ name: o.name, price: o.price })),
    total: total,
    timestamp: new Date().toISOString()
};

            // 3. Show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Creating payment...';
            submitBtn.classList.add('loading');
            showStatus('⏳', 'Creating Payment', 'Please wait while we connect to PayMongo...');

            try {
                // 4. Step 1: Create the Payment Intent
                const createResponse = await fetch('/api/create-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                });

                const createData = await createResponse.json();

                if (!createResponse.ok) {
                    throw new Error(createData.error || 'Payment creation failed.');
                }

                // 5. Store order data in localStorage for the success page
                localStorage.setItem('cafe_tamia_order', JSON.stringify({
                    ...orderPayload,
                    orderRef: createData.orderRef || 'N/A',
                    paymentId: createData.paymentIntentId || 'N/A'
                }));

                // 6. Step 2: Attach GCash as the payment method
                showStatus('⏳', 'Redirecting to GCash', 'Please wait while we prepare your payment...');
                submitBtn.textContent = '⏳ Redirecting...';

                const attachResponse = await fetch('/api/attach-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        paymentIntentId: createData.paymentIntentId,
                        clientKey: createData.clientKey
                    })
                });

                const attachData = await attachResponse.json();

                if (!attachResponse.ok) {
                    throw new Error(attachData.error || 'Failed to process payment method.');
                }

                // 7. Redirect the customer to the GCash authorization page
                closeStatus();
                submitBtn.textContent = 'Redirecting...';

                if (attachData.redirectUrl) {
                    window.location.href = attachData.redirectUrl;
                } else {
                    throw new Error('No redirect URL received. Payment status: ' + attachData.status);
                }

            } catch (err) {
                console.error('Payment error:', err);
                closeStatus();
                showStatus('❌', 'Payment Failed', err.message || 'Something went wrong. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Place Order · Pay with PayMongo';
                submitBtn.classList.remove('loading');
                return false;
            }

            return false; // Prevent default form submission
        }

        // ─── filter events ──────────────────────────────────────

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const filter = this.dataset.filter;
                if (currentFilter !== filter) {
                    buildQueue(filter);
                    renderNextCard();
                }
            });
        });

        // ─── init ──────────────────────────────────────────────

        attachSwipeEvents();
        loadMenuData();
        updateSummary();

        // If user lands with ?canceled=true, show a message
        if (window.location.search.includes('canceled=true')) {
            showStatus('↩️', 'Payment Cancelled', 'You cancelled the payment. You can try again anytime.');
        }
    </script>
