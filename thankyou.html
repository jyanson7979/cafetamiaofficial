<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed!</title>
  <link rel="icon" type="image/png" href="logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=League+Spartan:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-dim: #9c7a2e;
      --gold-pale: rgba(201, 168, 76, 0.12);
      --gold-border: rgba(201, 168, 76, 0.3);
      --white: #f5f0e8;
      --off-white: rgba(245, 240, 232, 0.85);
      --muted: rgba(245, 240, 232, 0.45);
      --divider: rgba(201, 168, 76, 0.2);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'League Spartan', sans-serif;
      background-color: #080808;
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      text-align: center;
    }

    /* ── CHECKMARK ANIMATION ── */
    .checkmark {
      width: 120px;
      height: 120px;
      margin: 0 auto 40px;
      position: relative;
      animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes scaleIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      50% {
        transform: scale(1.15);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .checkmark svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 20px rgba(201, 168, 76, 0.4));
    }

    /* ── HEADER ── */
    .header {
      margin-bottom: 32px;
    }

    .eyebrow {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
      animation: fadeInUp 0.8s ease 0.2s both;
    }

    .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 6vw, 3.8rem);
      font-weight: 300;
      line-height: 1.2;
      letter-spacing: 0.04em;
      color: var(--white);
      margin-bottom: 14px;
      animation: fadeInUp 0.8s ease 0.3s both;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      line-height: 1.6;
      animation: fadeInUp 0.8s ease 0.4s both;
    }

    /* ── MESSAGE BOX ── */
    .message-box {
      border: 1px solid var(--gold-border);
      border-radius: 2px;
      background: rgba(201, 168, 76, 0.03);
      padding: 32px 28px;
      margin: 40px 0;
      animation: fadeInUp 0.8s ease 0.5s both;
    }

    .message-box p {
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      line-height: 1.8;
      color: var(--off-white);
      margin-bottom: 12px;
    }

    .message-box p:last-child {
      margin-bottom: 0;
    }

    .highlight {
      color: var(--gold);
      font-weight: 600;
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 40px 0;
      animation: fadeInUp 0.8s ease 0.6s both;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--divider);
    }

    .divider-icon {
      color: var(--gold);
      font-size: 0.55rem;
      letter-spacing: 0.5em;
    }

    /* ── DETAILS ── */
    .details {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: 32px 0;
      animation: fadeInUp 0.8s ease 0.7s both;
    }

    .detail-item {
      padding: 16px;
      border-left: 2px solid var(--gold);
      background: rgba(201, 168, 76, 0.02);
      text-align: left;
    }

    .detail-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
      display: block;
    }

    .detail-value {
      font-size: 0.95rem;
      color: var(--white);
      letter-spacing: 0.04em;
    }

    /* ── BUTTON ── */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 40px;
      animation: fadeInUp 0.8s ease 0.8s both;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      border: none;
      border-radius: 2px;
      font-family: 'League Spartan', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      border-radius: 2px;
    }

    .btn-primary {
      background: var(--gold);
      color: #080808;
    }

    .btn-primary:hover {
      background: #e0bb5c;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--gold-border);
      color: var(--off-white);
    }

    .btn-secondary:hover {
      background: rgba(201, 168, 76, 0.1);
      border-color: var(--gold);
      color: var(--gold);
    }

    /* ── FOOTER ── */
    footer {
      margin-top: 60px;
      padding-top: 32px;
      border-top: 1px solid var(--divider);
      animation: fadeInUp 0.8s ease 0.9s both;
    }

    .footer-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      color: var(--gold);
      letter-spacing: 0.15em;
      margin-bottom: 16px;
      display: block;
    }

    .footer-text {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .title {
        font-size: 2rem;
      }

      .message-box {
        padding: 24px 20px;
      }

      .button-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- CHECKMARK -->
  <div class="checkmark">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="45" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.3"></circle>
      <circle cx="50" cy="50" r="45" fill="none" stroke="#c9a84c" stroke-width="2" stroke-dasharray="283" stroke-dashoffset="283" style="animation: dash 0.6s ease forwards 0.3s;"></circle>
      <polyline points="35,50 45,60 65,40" fill="none" stroke="#c9a84c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="50" stroke-dashoffset="50" style="animation: dash 0.6s ease forwards 0.6s;"></polyline>
    </svg>
  </div>

  <style>
    @keyframes dash {
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- HEADER -->
  <div class="header">
    <p class="eyebrow">Order Confirmed</p>
    <h1 class="title">Thank You!</h1>
    <p class="subtitle">Your order has been successfully placed. We're preparing your items with care.</p>
  </div>

  <!-- MESSAGE -->
  <div class="message-box">
    <p>We've received your order and our team is getting started right away.</p>
    <p style="margin-top: 16px;"><span class="highlight"></span>Thank you for choosing Cafe Tamia! ☕</p>
  </div>

  <!-- DIVIDER -->
  <div class="divider">
    <span class="divider-icon">✦ ✦ ✦</span>
  </div>

  <!-- DETAILS -->

  <!-- BUTTONS -->
  <div class="button-group">
    <a href="home.html" class="btn btn-primary">← Back to Home</a>
    <a href="OrderHereandOrderSummary.html" class="btn btn-secondary">View Menu Again</a>
  </div>

  <!-- FOOTER -->
  <footer>
    <span class="footer-logo">Cafe Tamia</span>
    <p class="footer-text">Serving Blissful Bites and Sips.</p>
  </footer>
</div>

</body>
</html>
